[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyslopeunits"
version = "0.1.0"
description = "A hierarchical graph-based algorithm for scalable slope-unit delineation from massive digital elevation models"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Ionut Sandric"}
]
keywords = [
  "slope units",
  "geomorphometry",
  "digital elevation model",
  "terrain analysis",
  "parallel computing",
  "GIS"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS"
]

dependencies = [
  "numpy>=1.26",
  "numba>=0.59",
  "rasterio>=1.3",
  "scipy>=1.11",
  "fiona>=1.9",
  "shapely>=2.0",
  "psutil>=5.9"
]

[project.scripts]
pyslopeunits = "pyslopeunits.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "build>=1.2",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
